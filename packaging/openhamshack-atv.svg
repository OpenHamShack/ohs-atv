<?xml version="1.0" encoding="UTF-8"?>
<!--
  OpenHamShack ATV app icon - shared by the package (hicolor/scalable) and the
  window, so there is one icon. Drawn by hand, no external assets.

  A picture monitor showing 75 % colour bars - the first thing every ATV
  station sends and the first thing anyone recognises as "television" - with
  a Yagi above it for the radio half. Big solid shapes, no text, so it still
  reads at 16 px; the gradients only add depth at 48 px and up.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4558"/>
      <stop offset="1" stop-color="#1b212c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bg)"/>
  <!-- Yagi: boom and elements -->
  <g stroke="#4fd1e8" stroke-width="2.2" stroke-linecap="round">
    <line x1="14" y1="13" x2="50" y2="13"/>
    <line x1="18" y1="8" x2="18" y2="18"/>
    <line x1="26" y1="9" x2="26" y2="17"/>
    <line x1="34" y1="9.5" x2="34" y2="16.5"/>
    <line x1="42" y1="10" x2="42" y2="16"/>
    <line x1="32" y1="13" x2="32" y2="21"/>
  </g>
  <!-- monitor -->
  <rect x="8" y="21" width="48" height="36" rx="6" fill="url(#bezel)"/>
  <rect x="12" y="25" width="40" height="28" rx="3" fill="#05070b"/>
  <g>
    <rect x="12" y="25" width="5" height="20" fill="#c0c0c0"/>
    <rect x="17" y="25" width="5" height="20" fill="#c0c000"/>
    <rect x="22" y="25" width="5" height="20" fill="#00c0c0"/>
    <rect x="27" y="25" width="5" height="20" fill="#00c000"/>
    <rect x="32" y="25" width="5" height="20" fill="#c000c0"/>
    <rect x="37" y="25" width="5" height="20" fill="#c00000"/>
    <rect x="42" y="25" width="5" height="20" fill="#0000c0"/>
    <rect x="47" y="25" width="5" height="20" fill="#000000"/>
    <rect x="12" y="45" width="40" height="8" fill="#0b0f15"/>
    <rect x="16" y="47.5" width="18" height="3" rx="1" fill="#e8edf4"/>
    <circle cx="44" cy="49" r="2" fill="#ff4d5e"/>
  </g>
  <rect x="12" y="25" width="40" height="28" rx="3" fill="url(#glass)"/>
</svg>
